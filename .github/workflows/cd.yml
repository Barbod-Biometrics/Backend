name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - tmp/deployment
      - feat/deploy
  pull_request:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: gateway
  IMAGE_PATH: barbod-biometrics

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: gateway
            dockerfile: gateway/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/${{ matrix.service.name }}:buildcache,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/deploy'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'

      - name: Build Gateway
        working-directory: gateway
        run: |
          go mod download
          go build -o main ./cmd/app

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/tmp/deployment' || github.ref == 'refs/heads/feat/deploy')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /root/barbod/Backend
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/gateway:${{ github.ref_name }}
            docker compose pull gateway
            docker compose up -d gateway
            docker compose logs -f gateway --tail 50

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, test, deploy]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "Build & Push: ${{ needs.build-and-push.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"

      - name: Notify on success
        if: ${{ needs.build-and-push.result == 'success' && needs.test.result != 'failure' }}
        run: echo "✅ CI/CD Pipeline completed successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ CI/CD Pipeline failed! Check logs for details."

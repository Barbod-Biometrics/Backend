name: CD Pipeline

on:
  push:
    branches:
      - develop
      - tmp/deployment
  pull_request:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}
  IMAGE_PATH: barbod-biometrics

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: gateway
            dockerfile: gateway/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref_name == 'develop' || github.ref_name == 'tmp/deployment' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/${{ matrix.service.name }}:buildcache,mode=max

  test:
    name: Build and Test Gateway (Go)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'

      - name: Generate Swagger Docs
        working-directory: gateway
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g ./cmd/app/main.go

      - name: Build Gateway
        working-directory: gateway
        run: |
          go mod download
          go build -o main ./cmd/app

      - name: Run Tests
        working-directory: gateway
        run: go test -v ./...

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/tmp/deployment')

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /root/barbod/Backend
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}/gateway:latest
            docker compose pull gateway
            docker compose up -d gateway            
            

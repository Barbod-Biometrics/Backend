services:
  postgres:
    image: postgres
    container_name: barbod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: barbod-redis
    restart: always
    ports:
      - "6379:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes # for data persistance
    healthcheck:  # for container health monitoring
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio
    container_name: barbod-minio
    restart: always
    ports:
      - "9000:${MINIO_PORT}"
      - "9001:${MINIO_PANEL_PORT}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  gateway:
    image: ghcr.io/barbod-biometrics/gateway:latest
    container_name: barbod-gateway
    restart: always
    ports:
      - "8080:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB} # usually 0
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE} # usually 10
      MINIO_HOST: minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_PANEL_PORT: ${MINIO_PANEL_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres-data:
  redis-data:
  minio-data:
    
services:
  postgres:
    image: postgres
    container_name: barbod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: barbod-redis
    restart: always
    ports:
      - "6379:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes # for data persistance
    healthcheck:  # for container health monitoring
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio
    container_name: barbod-minio
    restart: always
    ports:
      - "9000:${MINIO_PORT}"
      - "9001:${MINIO_PANEL_PORT}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: barbod-jaeger-dev
    restart: always
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686/api/traces"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile.dev
    container_name: barbod-gateway-dev
    restart: "no"
    ports:
      - "8080:${SERVER_PORT}"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
      - jaeger
    volumes:
      - ./gateway:/app:cached
      # cache module download and compiled package objects across container restarts
      - gateway-mod-cache:/go/pkg/mod
      - gateway-build-cache:/root/.cache/go-build
    working_dir: /app
    command: ["air"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  gateway-mod-cache:
  gateway-build-cache:
    
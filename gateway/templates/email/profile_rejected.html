<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body { font-family: Vazirmatn, Arial, sans-serif; direction: rtl; text-align: right; }
        .container { padding: 20px; }
        .header { background-color: #f8f9fa; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>عدم تایید پروفایل</h1>
        </div>
        <p>سلام <strong>{{.Name}}</strong> عزیز،</p>
        <p>متاسفانه پروفایل <strong>{{.ProfileName}}</strong> شما مورد تایید قرار نگرفت.</p>
        {{if .Reason}}
        <p>علت: {{.Reason}}</p>
        {{end}}
        <p>لطفاً اطلاعات خود را بررسی کرده و دوباره تلاش کنید.</p>
        <p>با تشکر،<br>تیم باربد</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body { font-family: Vazirmatn, Arial, sans-serif; direction: rtl; text-align: right; }
        .container { padding: 20px; }
        .header { background-color: #f8f9fa; padding: 10px; }
        .warning { color: #856404; background-color: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>هشدار موجودی کم</h1>
        </div>
        <p>سلام <strong>{{.Name}}</strong> عزیز،</p>
        <div class="warning">
            <p>موجودی پروفایل <strong>{{.ProfileName}}</strong> شما رو به اتمام است.</p>
            <p><strong>موجودی فعلی:</strong> {{.Balance}}</p>
        </div>
        <p>لطفاً برای جلوگیری از قطع سرویس، موجودی خود را افزایش دهید.</p>
        <p>با تشکر،<br>تیم باربد</p>
    </div>
</body>
</html>
